name: build
on:
  push:
  pull_request:
jobs:
  ios-fabric:
    runs-on: macos-14
    env:
      RCT_NEW_ARCH_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm pack --pack-destination /tmp
      - run: npx @react-native-community/cli@15.1.3 init AMapFabricExample --version 0.76.9 --skip-install
      - run: npm install
        working-directory: AMapFabricExample
      - run: npm install /tmp/react-native-amap3d-0.0.0.tgz
        working-directory: AMapFabricExample
      - run: bundle install
        working-directory: AMapFabricExample
      - run: bundle exec pod install
        working-directory: AMapFabricExample/ios
      - run: >-
          xcodebuild
          -workspace AMapFabricExample.xcworkspace
          -scheme AMapFabricExample
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: AMapFabricExample/ios

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm pack
      - run: npx @react-native-community/cli@15.1.3 init example --version 0.76.9 --skip-install
      - run: cp index.js example/
      - run: cp -r example-app example/
      - run: npm i ../react-native-amap3d-0.0.0.tgz
        working-directory: example
      - run: npm i @react-native-picker/picker @react-navigation/native @react-navigation/native-stack react-native-safe-area-context react-native-screens
        working-directory: example
      - run: ./gradlew :app:assembleDebug -PnewArchEnabled=true --stacktrace
        working-directory: example/android
      - uses: actions/upload-artifact@v4
        with:
          name: example.apk
          path: example/android/app/build/outputs/apk/debug/app-debug.apk
